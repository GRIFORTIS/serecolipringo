name: Security question
description: Propose one question about preventing unauthorized spending.
title: "[Security] "
labels:
  - "domain: security"
  - "status: draft"
body:
  - type: markdown
    attributes:
      value: |
        Propose one factual Security question. Use only fictional examples—never publish real wallet or recovery details.

  - type: input
    id: factor
    attributes:
      label: Factor
      description: What single Security factor does this question measure?
      placeholder: Exposure of key material
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask about a fact of the setup, not how safe someone feels.
      placeholder: Has any key or backup ever been photographed or stored in the cloud?
    validations:
      required: true

  - type: textarea
    id: answers
    attributes:
      label: Answer choices
      description: List answers from worst to best as “score — answer.” Include “0 — I don't know.”
      placeholder: |
        0 — I don't know
        0 — Yes
        5 — No
    validations:
      required: true

  - type: dropdown
    id: breaker
    attributes:
      label: Breaker or cap?
      description: Does any answer cap the Security score regardless of other answers?
      options:
        - "No"
        - "Yes"
        - "Unsure—needs critique"
    validations:
      required: true

  - type: textarea
    id: breaker_details
    attributes:
      label: Breaker or cap details
      description: If applicable, identify the answer, cap, and reason.

  - type: textarea
    id: cross_effects
    attributes:
      label: Cross-effects
      description: List effects on other domains as -1, 0, or +1 and explain why.
      placeholder: |
        Privacy: -1 — reason
        Inheritance: +1 — reason
    validations:
      required: true

  - type: textarea
    id: persona_test
    attributes:
      label: Fictional persona test
      description: Apply the question to a fictional setup and state the expected answer and score.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This issue contains no real seed material or sensitive wallet details.
          required: true
